name: Nightly lead extraction

# Runs each county's master.py in daily mode, then commits whatever new
# leads (dated .xlsx exports) and updated pipeline_cache.db/.last_dc_run.json
# state came out of the run. Pushing to main is what actually surfaces new
# leads on the live dashboard - Render auto-redeploys on push, and
# dashboard.py reads confirmed leads straight from the committed .xlsx files
# in UT/slk, UT/uta, AZ/mar, AZ/apa, AZ/gre, AZ/gra, AZ/pim, and AZ/gil (see load_confirmed_leads_from_excel()).
on:
  schedule:
    # 07:00 UTC = midnight Mountain Daylight Time. Shifts to 1am Mountain
    # Standard Time when DST ends each November (GitHub Actions cron is
    # always UTC, no per-timezone/DST awareness) - adjust if that drift
    # matters.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        type: choice
        options: [daily, weekly]
        default: daily
      county:
        description: "Which county to run"
        type: choice
        options: [all, slk, uta, mar, apa, gre, gra, pim, gil]
        default: all

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 removed the stdlib distutils module that undetected_chromedriver
          # still imports (ModuleNotFoundError: No module named 'distutils') -
          # 3.11 is the newest version that still ships it.
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas openpyxl xlrd selenium undetected-chromedriver webdriver-manager requests

      - name: Install virtual display (Chrome runs non-headless to avoid bot detection)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Salt Lake County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'slk'
        working-directory: UT/slk
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Utah County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'uta'
        working-directory: UT/uta
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Maricopa County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'mar'
        working-directory: AZ/mar
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Apache County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'apa'
        working-directory: AZ/apa
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Greenlee County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'gre'
        working-directory: AZ/gre
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Graham County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'gra'
        working-directory: AZ/gra
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Pima County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'pim'
        working-directory: AZ/pim
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Gila County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'gil'
        working-directory: AZ/gil
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Commit and push new leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add UT/slk UT/uta AZ/mar AZ/apa AZ/gre AZ/gra AZ/pim AZ/gil
          git diff --cached --quiet || git commit -m "Lead extraction $(date -u +%Y-%m-%d) (${{ inputs.mode || 'daily' }}, ${{ inputs.county || 'all' }})"
          git push
