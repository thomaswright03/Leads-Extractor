name: Nightly lead extraction

# Runs each county's master.py in daily mode, then commits whatever new
# leads (dated .xlsx exports) and updated pipeline_cache.db/.last_dc_run.json
# state came out of the run. Pushing to main is what actually surfaces new
# leads on the live dashboard - Render auto-redeploys on push, and
# dashboard.py reads confirmed leads straight from the committed .xlsx files
# in UT/slk, UT/uta, UT/web, AZ/mar, AZ/apa, AZ/gre, AZ/gra, AZ/pim, AZ/gil, AZ/yum, and AZ/yav (see load_confirmed_leads_from_excel()).
on:
  schedule:
    # 07:00 UTC = midnight Mountain Daylight Time. Shifts to 1am Mountain
    # Standard Time when DST ends each November (GitHub Actions cron is
    # always UTC, no per-timezone/DST awareness) - adjust if that drift
    # matters.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        type: choice
        options: [daily, weekly]
        default: daily
      county:
        description: "Which county to run"
        type: choice
        options: [all, slk, uta, web, mar, apa, gre, gra, pim, gil, yum, yav]
        default: all

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    # Was 90. Since lookups started actually reading obituaries (PR #4),
    # Maricopa's confirmation step alone runs 30+ minutes, and on
    # 2026-10-20 the job was cancelled mid-Maricopa, so no Arizona county
    # after it ran at all. 300 leaves room for every county (GitHub's
    # limit for hosted runners is 360).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 removed the stdlib distutils module that undetected_chromedriver
          # still imports (ModuleNotFoundError: No module named 'distutils') -
          # 3.11 is the newest version that still ships it.
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas openpyxl xlrd selenium undetected-chromedriver webdriver-manager requests

      - name: Install virtual display (Chrome runs non-headless to avoid bot detection)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Salt Lake County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'slk'
        id: slk
        # continue-on-error on every county step below: without it, GitHub
        # Actions' default behavior is that one failing step stops the whole
        # job immediately and skips everything after it - including the
        # single combined "Commit and push new leads" step at the end. That
        # would mean one bad county (confirmed live: Pima's network block,
        # Gila's CAPTCHA wall) silently blocks every OTHER county's
        # already-successful results from ever reaching the live site, not
        # just its own. A failed step still shows a warning in the Actions
        # UI - it just doesn't take the rest of the run down with it.
        continue-on-error: true
        working-directory: UT/slk
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Utah County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'uta'
        id: uta
        continue-on-error: true
        working-directory: UT/uta
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Weber County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'web'
        id: web
        continue-on-error: true
        working-directory: UT/web
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Maricopa County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'mar'
        id: mar
        continue-on-error: true
        working-directory: AZ/mar
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Apache County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'apa'
        id: apa
        continue-on-error: true
        working-directory: AZ/apa
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Greenlee County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'gre'
        id: gre
        continue-on-error: true
        working-directory: AZ/gre
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Graham County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'gra'
        id: gra
        continue-on-error: true
        working-directory: AZ/gra
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Pima County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'pim'
        id: pim
        continue-on-error: true
        working-directory: AZ/pim
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      # Paused 2026-10-19: Gila's assessor site answers 403 to GitHub
      # Actions runners, so this only ever fails here. It still runs when
      # dispatched by hand for county=gil (e.g. to check if it's unblocked).
      # Also listed in PAUSED_COUNTY_FOLDERS in UT/dashboard.py.
      - name: Run Gila County pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.county == 'gil'
        id: gil
        continue-on-error: true
        working-directory: AZ/gil
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Yuma County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'yum'
        id: yum
        continue-on-error: true
        working-directory: AZ/yum
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Run Yavapai County pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.county == 'all' || inputs.county == 'yav'
        id: yav
        continue-on-error: true
        working-directory: AZ/yav
        run: xvfb-run -a python3 master.py ${{ inputs.mode || 'daily' }}

      - name: Commit and push new leads
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add UT/slk UT/uta UT/web AZ/mar AZ/apa AZ/gre AZ/gra AZ/pim AZ/gil AZ/yum AZ/yav
          git diff --cached --quiet || git commit -m "Lead extraction $(date -u +%Y-%m-%d) (${{ inputs.mode || 'daily' }}, ${{ inputs.county || 'all' }})"
          git push

      # The county steps above use continue-on-error so one broken county
      # can't stop the others' leads from being committed - but that also
      # meant a broken county never turned the run red (Legacy.com lookups
      # failed for four weeks unnoticed). Fail here, after the commit, so
      # the run still saves what worked and shows which counties didn't.
      - name: Fail the run if any county failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.slk.outcome }}" = "failure" ] && failed="$failed slk"
          [ "${{ steps.uta.outcome }}" = "failure" ] && failed="$failed uta"
          [ "${{ steps.web.outcome }}" = "failure" ] && failed="$failed web"
          [ "${{ steps.mar.outcome }}" = "failure" ] && failed="$failed mar"
          [ "${{ steps.apa.outcome }}" = "failure" ] && failed="$failed apa"
          [ "${{ steps.gre.outcome }}" = "failure" ] && failed="$failed gre"
          [ "${{ steps.gra.outcome }}" = "failure" ] && failed="$failed gra"
          [ "${{ steps.pim.outcome }}" = "failure" ] && failed="$failed pim"
          [ "${{ steps.gil.outcome }}" = "failure" ] && failed="$failed gil"
          [ "${{ steps.yum.outcome }}" = "failure" ] && failed="$failed yum"
          [ "${{ steps.yav.outcome }}" = "failure" ] && failed="$failed yav"
          if [ -n "$failed" ]; then
            echo "::error::County pipelines failed:$failed"
            exit 1
          fi
